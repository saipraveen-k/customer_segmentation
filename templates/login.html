<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Customer Segmentation</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="auth"><div class="box">
  <h2>📊 Customer Segmentation</h2><p class="sub">Sign in to continue</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Username</label><input type="text" name="username" required autofocus>
    <label>Password</label><input type="password" name="password" required>
    <p><button class="btn" style="width:100%">Login</button></p>
  </form>
  <p style="font-size:14px">No account? <a href="{{ url_for('register') }}">Register</a></p>
  <div class="hint"><b>Demo logins</b><br>admin / admin123<br>analyst / analyst123</div>
</div></div></body></html>
